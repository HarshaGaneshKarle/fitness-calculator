<html>
    <head>
        <title>My Fitness Calculator</title>
        <style>
            body{
                font-family:Arial, sans-serif;
                background-color:#1a1a2e;
                color:white;
                display:flex;
                justify-content:center;
                padding:40px;
            }
            #tagline{
                text-align:center;
                color:#a8a8b3;
                font-size:13px;
                margin-top:-15px;
                margin-bottom:10px;
                font-style:italic;
            }
            .container{
                background-color:#16213e;
                padding:40px;
                border-radius:16px;
                width:400px;
            }
            h1{
                color:#e94560;
                text-align:center;
            }
            label{
                display:block;
                margin-top:16px;
                color:#a8a8b3;
            }
            input, select {
                width: 100%;
                padding:10px;
                margin-top:8px;
                border-radius:8px;
                border:none;
                background-color:#0f3460;
                color:white;
                font-size:16px;
                box-sizing:border-box;
            }
            button{
                width:100%;
                padding:12px;
                margin-top:24px;
                background-color:#e94560;
                color:white;
                border:none;
                border-radius:8px;
                font-size:16px;
                cursor:pointer;
            }
            button:hover{
                background-color:#c73652;
            }
            #result{
                margin-top:24px;
                background-color:#0f3460;
                padding:20px;
                border-radius:12px;
                line-height:2;
                font-size:15px;
            }
        </style>
    </head>
    <body>
    <div class="container">
    <h1>Fitness Calculator</h1>
    <p id="tagline">Buitl from real experience</p>
    <label>Enter your body weight (kg):</label>
    <input type="number"id="weight">
    <br><br>
    <label>Select your goal:</label>
    <select id="goal">
        <option value="cut">Cut(Lose Fat)</option>
        <option value="bulk">Bulk(Build Muscle)</option>
        <option value="maintain">Maintain</option>
    </select>
    
    <button onclick="calculate()">Calculate</button>
        <h2 id="result"></h2>
        <script>
            function calculate(){
                let weight=document.getElementById("weight").value;
                let goal=document.getElementById("goal").value;
                let calories, protein, fat;
                if (goal==="cut"){
                calories=weight*22;
                protein=(weight*2.2).toFixed(1);
                fat=(weight*0.7).toFixed(1);
                }
                else if(goal==="bulk"){
                    calories=weight*38;
                    protein=(weight*1.9).toFixed(1);
                    fat=(weight*0.9).toFixed(1);
                }else{
                    calories=weight*30;
                    protein=(weight*2.0).toFixed(1);
                    fat=(weight*0.8).toFixed(1);
                }
                let fiber=((calories/1000)*14).toFixed(1);
                let carbs=((calories-(protein*4+fat*9))/4).toFixed(1);
                let bmi=(weight/1.75/1.75).toFixed(1);

                document.getElementById("result").innerText=
                "Goal: "+goal.toUpperCase()+"\n"+
                "Calories:"+calories+"kacl\n"+
                "Protein:"+protein+"grams\n"+
                "Fat:"+fat+"grams\n"+
                "Fiber :"+fiber+"grams\n"+
                "Carbs:"+carbs+"grams\n"+
                "BMI:"+bmi;
            }
            </script>
    </div>
    </body>
</html>
